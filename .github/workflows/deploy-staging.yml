name: Deploy Staging (S1)

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend tests (best-effort)
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt || true
          pytest -q || true

      - name: Analytics tests (best-effort)
        working-directory: analytics
        run: |
          python -m pip install -r requirements.txt || true
          pytest -q || true

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    env:
      S1_HOST: ${{ secrets.S1_HOST }}
      S1_PORT: ${{ secrets.S1_PORT }}
      S1_USER: ${{ secrets.S1_USER }}
      S1_KEY:  ${{ secrets.S1_KEY }}

    steps:
      - name: Validate inputs
        run: |
          for v in S1_HOST S1_PORT S1_USER S1_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error ::$v is empty. Add it in Settings → Secrets → Actions."
              exit 1
            fi
          done
          echo "Using $S1_USER@$S1_HOST:$S1_PORT"

      - name: Trust S1 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$S1_PORT" "$S1_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to S1 (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.S1_HOST }}
          port:     ${{ env.S1_PORT }}
          username: ${{ env.S1_USER }}
          key:      ${{ env.S1_KEY }}
          script: |
            set -Eeuo pipefail

            # Ensure checkout exists
            if [ ! -d /opt/AnimoAssign3-staging/.git ]; then
              mkdir -p /opt/AnimoAssign3-staging
              cd /opt/AnimoAssign3-staging
              git clone https://github.com/HIEB1I/AnimoAssign3.git .
            else
              cd /opt/AnimoAssign3-staging
            fi

            # Pull via HTTPS (no SSH needed on server)
            unset GIT_SSH_COMMAND || true
            git config --global url.https://github.com/.insteadof git@github.com:
            git config --global url.https://github.com/.insteadof ssh://git@github.com/
            git config --global --add safe.directory /opt/AnimoAssign3-staging
            git remote set-url origin https://github.com/HIEB1I/AnimoAssign3.git

            git fetch --all --prune

            # --- Force-sync staging to remote, with a backup if there are local commits
            if ! git merge-base --is-ancestor HEAD origin/staging; then
              ts=$(date +%Y%m%d-%H%M%S)
              echo "::warning ::Local staging diverged; backing up to /opt/AnimoAssign3-staging-backup-$ts.bundle and hard-resetting."
              git bundle create "/opt/AnimoAssign3-staging-backup-$ts.bundle" --all || true
            fi
            git checkout -B staging origin/staging
            git reset --hard origin/staging

            # ---------- Artifacts directory (outside repo), with fallback ----------
            ART="/opt/AnimoAssign3-staging-data/tmp"
            if ! mkdir -p "$ART" 2>/dev/null; then
              # no permission under /opt — fall back to $HOME
              ART="$HOME/animoassign-staging-data/tmp"
              mkdir -p "$ART"
              echo "::notice ::Using user-writable artifacts dir: $ART"
            fi
            chmod 755 "$ART"
            # ----------------------------------------------------------------------

            # Don't let git clean touch repo/tmp (might contain uploaded dumps)
            git clean -fdx -e tmp/** || true

            # Compose files
            FILE=docker/docker-compose.staging.yml
            ENVF=docker/staging.env
            [ -f "$FILE" ] || { echo "Compose file not found: $FILE"; exit 1; }
            [ -f "$ENVF" ] || { echo "Env file not found: $ENVF"; exit 1; }

            export COMPOSE_PROJECT_NAME=animo_staging
            set -a; . "$ENVF"; set +a

            # Clean once to absorb legacy containers
            docker compose -f "$FILE" --env-file "$ENVF" down --remove-orphans || true
            for c in backend-stg analytics-stg frontend-stg mongo-stg; do
              docker rm -f "$c" 2>/dev/null || true
            done

            # --- 1) Start ONLY mongo first ---
            docker compose -f "$FILE" --env-file "$ENVF" up -d mongo-stg

            # Wait for mongo to be reachable
            i=0; until docker exec -i mongo-stg mongosh \
                  -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" \
                  --authenticationDatabase admin --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q '^1$'; do
              i=$((i+1)); [ "$i" -gt 60 ] && { echo "::error ::mongo-stg did not become ready"; docker logs mongo-stg | tail -n 200; exit 1; }
              sleep 2
            done
            echo "::notice ::mongo-stg is ready"

            # --- 2) Ensure app user + permissions BEFORE backend starts ---
            docker exec -i mongo-stg mongosh -u root -p 'StagingDLSU' --authenticationDatabase admin --quiet <<'JS'
            db = db.getSiblingDB("admin");
            try {
              db.updateUser("animo_app", { pwd: "StagingDLSU" });
            } catch(e) {
              // Fallback for versions that prefer this helper
              db.changeUserPassword("animo_app", "StagingDLSU");
            }
            // Ensure role is correct
            const dbname = "animoassign_dev";
            const u = db.getUser("animo_app");
            db.revokeRolesFromUser("animo_app", (u && u.roles) || []);
            db.grantRolesToUser("animo_app", [{ role: "dbOwner", db: dbname }]);
            print("animo_app password + roles updated");
            JS

            # Optional: verify the app user can create an index
            docker exec -i mongo-stg mongosh \
              -u animo_app -p 'StagingDLSU' --authenticationDatabase admin --quiet <<'JS'
            const dbname = "animoassign_dev";
            const coll = "faculty_profiles";
            db = db.getSiblingDB(dbname);
            db[coll].createIndex({ user_id: 1 }, { name: "user_id_1" });
            print("app user can create indexes on " + dbname + "." + coll);
            JS

            # --- 3) Now start backend/analytics/frontend ---
            SERVICES=$(docker compose -f "$FILE" config --services | grep -v '^mongo-stg$' || true)
            echo "::notice ::Compose services: $SERVICES"
            docker compose -f "$FILE" --env-file "$ENVF" up -d --build $SERVICES

            # Health checks inside networks
            DEF_NET="${COMPOSE_PROJECT_NAME}_default"
            EXT_NET="docker_animoassign"
            curl_wait() {
              local net="$1" url="$2" svc="$3" tries="${4:-40}" i=0
              while true; do
                if docker run --rm --network "$net" curlimages/curl:8.10.1 -fsS "$url" >/dev/null 2>&1; then
                  echo "::notice ::$svc is healthy at $url"
                  break
                fi
                i=$((i+1)); if [ "$i" -ge "$tries" ]; then
                  echo "::error ::$svc did not become ready at $url"
                  docker compose -f "$FILE" logs --tail=200 "$svc" || true
                  exit 1
                fi
                sleep 3
              done
            }
            curl_wait "$DEF_NET" http://backend-stg:8000/health   backend-stg
            curl_wait "$DEF_NET" http://analytics-stg:8000/health analytics-stg
            curl_wait "$EXT_NET" http://frontend-stg              frontend-stg

            docker system prune -f || true
