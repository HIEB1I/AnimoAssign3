# nginx.prod.s1.conf

upstream frontend_upstream {
    server frontend-primary:80 weight=10;
    server 10.1.11.17:28080 backup;
    keepalive 32;
}

upstream backend_upstream {
    server backend-primary:8000 weight=10;
    server 10.1.11.17:28000 backup;
    keepalive 32;
}

upstream analytics_upstream {
    server analytics-primary:8000 weight=10;
    server 10.1.11.17:28100 backup;
    keepalive 32;
}

upstream backend_stg { 
   server backend-stg:8000;
}

upstream analytics_stg {
   server analytics-stg:8000;
}

upstream frontend_stg {
   server frontend-stg:80;
}

server {
  listen 80;
  listen [::]:80;
  server_name ccscloud.dlsu.edu.ph;

  access_log /dev/stdout;
  error_log  /dev/stderr info;

  # Increase body size for JSON/posts (optional)
  client_max_body_size 10m;

  # Common proxy headers/timeouts
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_connect_timeout 10s;
  proxy_read_timeout    60s;

  # Prefer the primary; if it’s down, try backup
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

 # ---- STAGING (put these before the generic / block) ----
  # ensure trailing slash for SPA base=/staging/
  location = /staging { 
    return 301 /staging/; 
  }

  location = /staging/summary {
    return 301 /staging/analytics/summary;
  }

  # If someone calls /staging/records or /staging/records/..., send it to backend
  location ^~ /staging/records/ {
    proxy_pass http://backend_stg/;   # will pass /records... to backend
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Canonicalize /staging/records (no trailing slash) → /staging/records/
  location = /staging/records {
    return 301 /staging/records/;
  }

  location /staging/api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # preserve /api by mapping /staging/api/ → /api/
    proxy_pass http://backend_stg/api/;
  }

  location /staging/analytics/ {
    proxy_pass http://analytics_stg/analytics/;  # note trailing slash to strip prefix
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /staging/ {
    proxy_pass http://frontend_stg/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /staging/assets/ {
  proxy_pass http://frontend_stg/assets/;  # '/staging/assets/x' -> '/assets/x'
  }

 # ---- PRODUCTION ---- -
  # 1) /api → backend /api  (preserve /api)
  location /api/ {
    proxy_pass http://backend_upstream/api/;   # keep /api
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # 2) /analytics → analytics /analytics  (preserve /analytics)
  location /analytics/ {
    proxy_pass http://analytics_upstream/analytics/;  # keep /analytics
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Convenience redirect (unchanged header note)
  location = /analytics/overview {
    return 302 /analytics/summary;
    add_header X-From "nginx-s1" always;  # change to nginx-s2 in s2 conf
  }

  # If your UI calls /analytics/records/* but data comes from backend, keep this shim
  location ^~ /analytics/records/ {
    proxy_pass http://backend_upstream/records/;  # strip /analytics/ and keep /records/*
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    add_header         X-From     "nginx-s1"      always;  # change to nginx-s2 on S2
    add_header         X-Upstream $upstream_addr  always;
  }

  # 3) Frontend (SPA): everything else to frontend
  location / {
    proxy_pass http://frontend_upstream;   # no trailing slash → keep paths as-is
  }

  # (Optional) health endpoint straight to backend
  location = /healthz {
    proxy_pass http://backend_upstream/health;
  }
}